<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Web Engineering Lab</title>

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header>
      <h1 id="greeting">Hello!</h1>

      <nav>
        <ul>
          <li>
            <a href="index.html" class="nav-link" aria-current="location">
              Home
            </a>
          </li>

          <li>
            <a href="#office-hours" class="nav-link"> Office Hours </a>
          </li>

          <li>
            <a href="#feedback" class="nav-link"> Send Feedback </a>
          </li>
        </ul>
      </nav>
    </header>

    <main id="main-content">
      <section id="office-hours">
        <h2>Office Hours</h2>

        <p class="text-muted">
          Our office is available during the following hours.
        </p>
      </section>

      <section id="feedback">
        <h2>Send Feedback</h2>

        <form>
          <p>
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required />
          </p>

          <p>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />
          </p>

          <p>
            <label for="message">Message</label>
            <textarea id="message" name="message"></textarea>
          </p>

          <button type="submit">Submit</button>
        </form>
      </section>
    </main>

    <footer>
      <address>Contact us at our office.</address>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
